<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sense AI — Real-time AI-powered sign language and object detection platform. Recognize hand gestures and identify objects using machine learning in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Sense AI — AI-Powered Detection Platform</title>
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so dark-mode users
      // never see a flash of the light palette.
      (function () {
        try {
          var saved = localStorage.getItem('senseai-theme');
          var dark = saved
            ? saved === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { /* storage blocked — fall back to light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
